[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "language-edge-explorer"
version = "0.1.1"
description = "Explore sampled prompt coverage in model-specific image VAE representations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "Pillow>=13,<14", "scipy>=1.17.1,<2", "scikit-learn>=1.9.1,<2"]

[project.optional-dependencies]
generate = ["torch>=2.15,<3", "diffusers>=0.42.1,<0.43", "transformers>=5.22.1,<6", "accelerate>=1.15,<2", "safetensors>=0.8,<1", "huggingface-hub>=2.4,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
language-edge = "language_edge.cli:main"

[tool.setuptools.packages.find]
include = ["language_edge*"]

[tool.setuptools.package-data]
language_edge = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
